# Kernel isolation RuntimeClasses for agent-sandbox pods.
#
# Preference (AWS EKS and general):
#   1) gVisor (handler: runsc) — user-space kernel; supported on EKS worker
#      nodes when runsc + containerd shim are installed on the node AMI /
#      bootstrap (see AWS gVisor on EKS / gvisor.dev containerd docs).
#   2) Kata Containers (handler: kata) — hardware VM isolation when the
#      cluster provides Kata (e.g. Firecracker/QEMU). Use when gVisor is
#      unavailable on the node pool.
#
# The SandboxTemplate sets runtimeClassName: gvisor. Switch the template to
# "kata" only if your nodes register the kata handler instead of runsc.
---
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: gvisor
  labels:
    app.kubernetes.io/part-of: agentic-chain
    sandbox.agents.x-k8s.io/isolation: gvisor
handler: runsc
# Optional scheduling hint for dedicated gVisor node pools on EKS:
# scheduling:
#   nodeSelector:
#     sandbox.agents.x-k8s.io/runtime: gvisor
---
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: kata
  labels:
    app.kubernetes.io/part-of: agentic-chain
    sandbox.agents.x-k8s.io/isolation: kata
handler: kata
