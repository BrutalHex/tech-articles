apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentic-chain-app
  labels:
    app: agentic-chain-app
---
# Permissions required by k8s-agent-sandbox to claim warm-pool sandboxes and
# inspect Sandbox/Claim status (including code-execution history metadata).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agentic-chain-sandbox-client
  labels:
    app: agentic-chain-app
rules:
  - apiGroups: ["extensions.agents.x-k8s.io"]
    resources: ["sandboxclaims"]
    verbs: ["create", "get", "list", "watch", "delete", "patch", "update"]
  - apiGroups: ["extensions.agents.x-k8s.io"]
    resources: ["sandboxwarmpools", "sandboxtemplates"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agentic-chain-sandbox-client
  labels:
    app: agentic-chain-app
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agentic-chain-sandbox-client
subjects:
  - kind: ServiceAccount
    name: agentic-chain-app
