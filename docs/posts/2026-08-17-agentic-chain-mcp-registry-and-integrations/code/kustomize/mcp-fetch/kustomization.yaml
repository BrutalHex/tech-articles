apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: agentic-chain

resources:
  - deployment.yaml

configMapGenerator:
  - name: mcp-fetch-server
    files:
      - server.json
    options:
      disableNameSuffixHash: true

images:
  - name: agentic-chain-mcp-fetch
    newName: agentic-chain-mcp-fetch
    newTag: v2026.08.01
