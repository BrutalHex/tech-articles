# Secure Python runtime template used by the warm pool.
# Claims adopt pre-warmed sandboxes from SandboxWarmPool for low-latency code execution.
# Isolation: runtimeClassName=gvisor (runsc). Do not switch this to a non-gVisor class.
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: python-runtime-template
  labels:
    app.kubernetes.io/name: python-runtime-template
    app.kubernetes.io/part-of: agentic-chain
    sandbox.agents.x-k8s.io/isolation: gvisor
spec:
  # Reject claim-time env / volume overrides so warm-pool sandboxes stay on the fast path
  # and stay consistent with this hardened template.
  envVarsInjectionPolicy: Disallowed
  volumeClaimTemplatesPolicy: Disallowed

  # Per-sandbox headless Service for stable in-cluster DNS (used by SandboxInClusterConnectionConfig).
  service: true

  # Kind/runc POC: keep Unmanaged if the controller network-policy plugin is unavailable.
  networkPolicyManagement: Unmanaged

  podTemplate:
    metadata:
      labels:
        app: python-runtime-sandbox
        sandbox.agents.x-k8s.io/purpose: sandbox-mcp
        sandbox.agents.x-k8s.io/isolation: gvisor
    spec:
      automountServiceAccountToken: false
      # Strongest practical isolation for untrusted agent code (EKS + kind with runsc).
      # Handler "runsc" is provided by RuntimeClass/gvisor (see runtime-isolation/).
      runtimeClassName: gvisor
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: python-runtime
          image: registry.k8s.io/agent-sandbox/python-runtime-sandbox:v0.5.4
          imagePullPolicy: IfNotPresent
          # python-runtime-sandbox hard-codes cwd=/app and maps file APIs under /app
          # (leading "/" is stripped). Pin the same folder so MCP upload + execute agree.
          workingDir: /app
          env:
            - name: HOME
              value: /app
            - name: PYTHONPATH
              value: /app
          ports:
            - name: runtime
              containerPort: 8888
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
              ephemeral-storage: 32Mi
            limits:
              cpu: 150m
              memory: 160Mi
              ephemeral-storage: 96Mi
          readinessProbe:
            httpGet:
              path: /
              port: runtime
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /
              port: runtime
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
      restartPolicy: OnFailure
